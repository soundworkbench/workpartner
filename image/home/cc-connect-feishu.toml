# 工作伙伴消息桥（JConnect）：默认 Codex 引擎（界面叫 ChatGPT），经组织模型服务，免确认。
# 由切换脚本按本人原来的飞书机器人填 __PROJECT__、__ALLOW_FROM__、__APP_ID__、__APP_SECRET__，写到 /data/.cc-connect/config.toml（600）。
data_dir = "/data/.cc-connect/data"
language = "zh"
idle_timeout_mins = 120
max_turn_time_mins = 120

[display]
mode = "quiet"
thinking_messages = true
thinking_max_len = 0
tool_messages = false
hide_agent_footer = true

[stream_preview]
enabled = true
interval_ms = 700
min_delta_chars = 12
segmented = true
step_list = true
end_mode = "settle"
reveal_cps = 90
print_strategy = "delay"
push_interval_ms = 150
typing_step = 4
max_chars = 4000
typing_marker = "..."

[[projects]]
name = "__PROJECT__"
reply_footer = false
show_context_indicator = false
show_workdir_indicator = false

[projects.agent]
type = "codex"

[projects.agent.options]
work_dir = "/data/work"
codex_home = "/data/.codex"
mode = "yolo"
model = "__CODEX_MODEL__"
reasoning_effort = "__EFFORT__"

[[projects.platforms]]
type = "feishu"

[projects.platforms.options]
enable_feishu_card = true
progress_style = "compact"
keep_preview_on_finish = false
reaction_emoji = "OnIt"
done_emoji = "none"
reply_to_trigger = false
allow_from = "__ALLOW_FROM__"
allow_chat = "*"
p2p_thread_isolation = true
share_session_in_channel = false
image_batch_window_ms = 800
app_id = "__APP_ID__"
app_secret = "__APP_SECRET__"
