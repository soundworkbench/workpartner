name: Publish user image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      - run: bash tools/check.sh
  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download pinned build inputs
        env:
          PKG: ${{ runner.temp }}/image-inputs
        run: python3 -I tools/download-inputs.py image/third-party.lock.json "$PKG"
      - name: Build image
        env:
          PKG: ${{ runner.temp }}/image-inputs
          IMAGE_TAG: ghcr.io/soundworkbench/workpartner:${{ github.ref_name }}
        run: sh image/build.sh "$IMAGE_TAG"
      - name: Publish image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_TAG: ghcr.io/soundworkbench/workpartner:${{ github.ref_name }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE_TAG"
