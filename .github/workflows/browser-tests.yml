name: Browser tests
# Drives the real gateway and the real overlay files in the Chrome that ships with the runner.
# No secrets, no deployment: everything listens on 127.0.0.1 and uses made-up fixture identities.
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'preview/**'
      - 'image/rebrand/overlay/**'
      - 'tools/browser-tests/**'
      - '.github/workflows/browser-tests.yml'
permissions:
  contents: read
concurrency:
  group: browser-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [menu, flow, access, my-key, voice]
    defaults:
      run:
        shell: bash
    env:
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      # playwright-core only: no browser download, the preinstalled Chrome is used.
      - run: npm ci --prefix tools/browser-tests --ignore-scripts --no-audit --no-fund
      - name: Make sure a CJK font is installed (only matters for the screenshots)
        continue-on-error: true
        run: |
          if [ -z "$(fc-list :lang=zh 2>/dev/null)" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fi
      - name: Run the ${{ matrix.group }} group
        run: |
          set -o pipefail
          mkdir -p tools/browser-tests/output
          google-chrome --version || true
          node tools/browser-tests/run.mjs "$GROUP" 2>&1 | tee "tools/browser-tests/output/$GROUP.log"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-tests-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: tools/browser-tests/output/
