name: Bridge bump
on:
  repository_dispatch:
    types: [cc-connect-release]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-bump-${{ github.ref_name }}
  cancel-in-progress: false
env:
  BRIDGE_REPO: soundworkbench/cc-connect
  BUMP_BRANCH: bridge-bump/${{ github.ref_name }}
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare the pin with the newest bridge release
        id: plan
        run: |
          gh api "repos/$BRIDGE_REPO/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          python3 -I tools/bridge-bump.py plan "$RUNNER_TEMP/releases.json" image/third-party.lock.json >> "$GITHUB_OUTPUT"
      - name: Find an open bump PR that already pins this release
        id: open
        if: steps.plan.outputs.state == 'bump'
        env:
          URL: ${{ steps.plan.outputs.url }}
        run: |
          number=$(gh pr list --head "$BUMP_BRANCH" --base "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ] && git fetch --depth=1 origin "$BUMP_BRANCH" &&
             git show FETCH_HEAD:image/third-party.lock.json | grep -qF "\"$URL\""; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Bump PR #$number already pins ${{ steps.plan.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download the release asset and update the pin
        if: steps.plan.outputs.state == 'bump' && !steps.open.outputs.current
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          URL: ${{ steps.plan.outputs.url }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          curl -fsSL --proto '=https' --retry 3 -o "$RUNNER_TEMP/cc-connect" "$URL"
          python3 -I tools/bridge-bump.py apply image/third-party.lock.json docs/deployment.md \
            "$RUNNER_TEMP/cc-connect" --tag "$TAG" --url "$URL" --release "$RELEASE"
          git diff --stat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.plan.outputs.state == 'bump' && !steps.open.outputs.current
        with:
          node-version: '24'
      - name: Run the Linux checks
        if: steps.plan.outputs.state == 'bump' && !steps.open.outputs.current
        run: |
          npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/workpartner-check-env"
          "$RUNNER_TEMP/workpartner-check-env/bin/python" -m pip install PyYAML==6.0.3
          PATH="$RUNNER_TEMP/workpartner-check-env/bin:$PATH" bash tools/check.sh
      - name: Push the bump branch and open or update the PR
        if: steps.plan.outputs.state == 'bump' && !steps.open.outputs.current
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE: ${{ steps.plan.outputs.release }}
          NUMBER: ${{ steps.open.outputs.number }}
        run: |
          title="Upgrade the Feishu bridge to cc-connect $TAG"
          body="Pins cc-connect [$TAG]($RELEASE) in \`image/third-party.lock.json\` (version, url, release, sha256, bytes) and the version and digest quoted in \`docs/deployment.md\`. The bump workflow ran \`tools/check.sh\` on this change before pushing.

          Pull requests opened with the workflow token do not start other workflows: close and reopen this PR to run the Linux tests. After merging, check \`cc-connect --version\` in the built image as described in the deployment reference."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BUMP_BRANCH"
          git commit -qam "$title"
          git push --force origin "$BUMP_BRANCH"
          if [ -n "$NUMBER" ]; then
            gh pr edit "$NUMBER" --title "$title" --body "$body"
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$BUMP_BRANCH" --title "$title" --body "$body"
          fi
          echo "$title" >> "$GITHUB_STEP_SUMMARY"
